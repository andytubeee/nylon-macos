# Fake nylon network for trying the macOS menu app. Keys and hosts are made up.
routers:
  - id: alice
    pubkey: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    endpoints:
      - "alice.example.com:57175"
    addresses:
      - 10.0.0.1
      - fd00::1
  - id: bob
    pubkey: BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB=
    endpoints:
      - "bob.example.com:57175"
    addresses: [10.0.0.2]
    prefixes:
      - type: static
        prefix: 192.168.1.0/24
  - id: carol
    pubkey: CCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC=
    endpoints:
      - "203.0.113.7:57175"
    addresses: [10.0.0.3]
  - id: relay
    pubkey: DDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDD=
    endpoints:
      - "relay.example.com:57175"
clients:
  - id: phone
    pubkey: EEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEE=
    addresses: [10.0.0.20]
  - id: laptop
    pubkey: FFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFF=
    addresses: [10.0.0.21]
graph:
  - alice, bob, carol, relay
  - bob, phone
  - alice, laptop
